operations:
  # replaceValue is the simplest patch operation: it changes the text of one
  # XML element on one entity. Use it when you want to nudge a single number
  # or string (cost, amount, name key, icon path, ...).
  - id: lower-softwood-cost
    operation: replaceValue
    risk: low
    reason: Make the Sawmill cheaper to build with softwood.
    target:
      file: core/gdb/buildings.gd.xml
      # Replace entityGuid with the real Sawmill GUID for your game version.
      # generated/entities.json is the authoritative lookup.
      entityGuid: c732cb26-7487-4a7b-b1ba-b65e094f9bac
      entityName: Sawmill
      component: AspectBuildup
      # The path is XPath-like: navigate from the component to the value-bearing
      # element. The predicate Item[Content/Resource='...'] picks the right
      # ingredient when there are several.
      path: Costs/Item[Content/Resource='c22b4997-5563-44ab-8aa0-04a7b2c826be']/Content/Amount
    # expectedOldValue is a safety net: if the game database has changed and
    # the value is not 4 any more, the patcher refuses to apply.
    expectedOldValue: "4"
    value: "3"
