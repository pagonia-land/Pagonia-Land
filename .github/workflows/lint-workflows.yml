# Lints the GitHub Actions workflows themselves with actionlint
# (rhysd/actionlint). Catches the class of bug that only shows up when a
# workflow actually runs: invalid runner labels (e.g. a retired macos image),
# invalid `github.*` context access, expression / YAML errors, deprecated
# action versions, and — via the image's bundled shellcheck — bugs in `run:`
# bash blocks.
#
# Runs only when a workflow file changes. The local mirror is
# scripts/check-workflows.ps1 (keep the pinned actionlint version in sync with
# the image tag below).
name: lint-workflows

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/**']
  pull_request:
    branches: [main, master]
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
