# Builds and deploys the full Pagonia Land docs site to GitHub Pages.
#
# What ships:
#   /                — MkDocs Material docs site (home + Get Started + Database
#                      + Modding + Tools + Schemas + Reference), built from
#                      docs/ + selected root/tools/schemas READMEs imported via
#                      docs_hooks/prebuild.py into docs_build/.
#   /catalog/        — the static catalog browser from tools/catalog-browser/.
#
# What does NOT ship:
#   - generated/catalog/search-index.json (gitignored proprietary game data).
#     Visitors load their own local search-index.json through the file picker
#     in the catalog browser; localStorage remembers the choice across the
#     rest of the session.
#   - Anything under game-gdb/, game-paks/, snapshots/, or generated/.
#
# Setup once in the repo:
#   Repository Settings -> Pages -> Source: "GitHub Actions"
#
# Trigger: every push to main/master that touches the docs surface or the
# catalog browser, plus manual dispatch from the Actions tab.
name: pages

on:
  push:
    branches: [main, master]
    paths:
      # MkDocs build inputs
      - 'docs/**'
      - 'docs_hooks/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-prebuild.py'
      # Root-level docs that prebuild mirrors into the site
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'REVIEWING.md'
      - 'NOTICE.md'
      - 'CHANGELOG.md'
      - 'DATABASE_OVERVIEW.md'
      - 'REFERENCE.md'
      - 'VALIDATION_BASELINE.md'
      - 'UPDATE_PLAYBOOK.md'
      # Tool READMEs + CLI docs that prebuild mirrors
      - 'tools/README.md'
      - 'tools/pagonia-manager/README.md'
      - 'tools/pagonia-manager/CLI.md'
      - 'tools/pagonia-patcher/README.md'
      - 'tools/pagonia-patcher/CLI.md'
      - 'tools/pagonia-paker/README.md'
      - 'tools/pagonia-paker/CLI.md'
      - 'tools/pagonia-manager/CHANGELOG.md'
      # Sandbox + examples READMEs that prebuild mirrors
      - 'sandbox/README.md'
      - 'sandbox/examples/README.md'
      - 'sandbox/examples/manager-walkthrough/README.md'
      - 'examples/README.md'
      - 'examples/mod-repo-example/README.md'
      - 'examples/mod-catalog-example/README.md'
      # Schema READMEs that prebuild mirrors
      - 'schemas/README.md'
      - 'schemas/manager/README.md'
      - 'schemas/mod-patches/README.md'
      - 'schemas/patcher/README.md'
      - 'schemas/paker/README.md'
      # The catalog browser bundled at /catalog/
      - 'tools/catalog-browser/**'
      # The workflow itself
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; queue subsequent pushes rather than
# cancelling the in-flight run so a series of commits all reaches Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prebuild (mirror docs + imports into docs_build/)
        run: python scripts/docs-prebuild.py

      - name: Build MkDocs site
        run: mkdocs build

      # Mirror of the combine step in scripts/docs-build.ps1 — keep the two in sync.
      - name: Combine catalog browser at /catalog/
        run: cp -r tools/catalog-browser site/catalog

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
