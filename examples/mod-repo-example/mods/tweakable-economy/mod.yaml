patchFormatVersion: 0.1
id: pagonia-land.example.tweakable-economy
name: Tweakable Economy
version: 0.1.0
author: Pagonia Land
gameDatabaseVersion: "1.3.2-11873+194094"
description: >-
  Small worked example of a user-adjustable mod: it lowers the Sawmill's
  construction cost, and exposes that cost as a `softwood-cost` tweak so a
  player (or a collection curator) can dial it without editing the patch.
  Real game data — try it, then `pagonia-manager tweak set` it to taste.
requiredPackages:
  - core
optionalPackages: []
requiresNewGame: false
safeToRemove: unknown
multiplayerSafe: unknown
campaignSafe: unknown
loadAfter: []
loadBefore: []
incompatibleWith: []
tags:
  - tweakable
  - balance
  - qol
  - sawmill
patches:
  - patches/buildings.yaml
tweaks:
  - id: softwood-cost
    type: integer
    label: Softwood trunk cost
    description: How many Softwood Trunks the Sawmill costs to build (vanilla is 4).
    default: 3
    min: 1
    max: 8
    step: 1
