indexFormatVersion: "0.1"

repo:
  name: Pagonia Land Example Mods
  description: Reference Git-distribution repo for Pagonia Land. Three small mods + one collection that ties two of them together; designed for modders to fork as a starting point.
  author: Pagonia Land
  homepage: https://github.com/pagonia-land/Pagonia-Land
  license: MIT
  tags:
    - example
    - reference

mods:
  - id: pagonia-land.example.cheaper-sawmill
    path: mods/cheaper-sawmill
    displayName: Cheaper Sawmill
    description: Reduces the Sawmill's construction cost by one Softwood Trunk.
    version: 0.1.0
    gameDatabaseVersion: "1.4.0-11944+194631"
    tags:
      - qol
      - balance
      - sawmill
    safetyFlags:
      requiresNewGame: false
      safeToRemove: unknown
      multiplayerSafe: unknown
      campaignSafe: unknown

  - id: pagonia-land.example.wine-icon-test
    path: mods/wine-icon-test
    displayName: Wine Icon Test
    description: Cosmetic DLC-pack icon swap; demonstrates the optional-package patch shape.
    version: 0.1.0
    gameDatabaseVersion: "1.4.0-11944+194631"
    tags:
      - visual
      - dlc

  - id: pagonia-land.example.tweakable-economy
    path: mods/tweakable-economy
    displayName: Tweakable Economy
    description: Lowers the Sawmill cost and exposes it as a `softwood-cost` tweak; the worked example for user-adjustable mods.
    version: 0.1.0
    gameDatabaseVersion: "1.4.0-11944+194631"
    tags:
      - tweakable
      - balance
      - qol

collections:
  - id: pagonia-land.example.beginner-qol
    path: collections/beginner-qol.collection.yaml
    displayName: Beginner QoL Pack
    description: Small safe quality-of-life preset wiring both example mods into one ready-to-play setup.
    version: 0.1.0
    gameDatabaseVersion: "1.4.0-11944+194631"
    tags:
      - qol
      - preset
